<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BackroomsX — Level 0</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000;
               font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #app { position:fixed; inset:0; }
  .hud { position:fixed; color:#ff0; text-shadow:0 0 6px rgba(0,0,0,.9);
         user-select:none; pointer-events:none; z-index:10; }
  #info   { left:16px; bottom:14px; font-size:13px; color:#ffe9a8; }
  #pos    { left:16px; bottom:40px; font-size:15px; color:#fff5b8; }
  #rec    { left:18px; top:12px; font-size:18px; color:#ff4030;
            text-shadow:0 0 8px rgba(255,40,20,.6); letter-spacing:.08em; }
  #stamp  { right:18px; bottom:44px; font-size:14px; color:#ffe9a8; opacity:.85; }
  .brk    { position:fixed; width:26px; height:26px; z-index:11; pointer-events:none;
            border:0 solid rgba(255,240,210,.55); }
  #bk1 { left:10px;  top:8px;    border-left-width:3px; border-top-width:3px; }
  #bk2 { right:10px; top:8px;    border-right-width:3px; border-top-width:3px; }
  #bk3 { left:10px;  bottom:8px; border-left-width:3px; border-bottom-width:3px; }
  #bk4 { right:10px; bottom:8px; border-right-width:3px; border-bottom-width:3px; }
  #prompt { left:50%; top:58%; transform:translateX(-50%); font-size:19px;
            color:#fff; background:rgba(0,0,0,.45); padding:6px 14px;
            border-radius:6px; display:none; }
  #map    { right:12px; top:42px; width:320px; height:320px;
            background:rgba(0,0,0,.42); border:1px solid rgba(255,230,150,.35);
            border-radius:4px; }
  #fade   { position:fixed; inset:0; background:#000; opacity:0; z-index:20;
            pointer-events:none; }
  #start  { position:fixed; inset:0; z-index:30; display:flex;
            align-items:center; justify-content:center; flex-direction:column;
            background:radial-gradient(ellipse at 52% 42%, rgba(42,34,10,.9), rgba(3,3,1,.98));
            color:#ffe9a8; cursor:default; }
  #start::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.16;
                   background:repeating-linear-gradient(0deg, transparent 0 3px, #ffe9a8 4px);
                   mix-blend-mode:screen; }
  .menu-card { position:relative; width:min(420px, calc(100vw - 42px)); padding:30px 34px 28px;
               border:1px solid rgba(255,220,135,.34); background:rgba(10,9,3,.72);
               box-shadow:0 16px 80px rgba(0,0,0,.55), inset 0 0 50px rgba(255,185,30,.035);
               text-align:center; }
  .logo { display:inline-flex; align-items:center; gap:13px; margin:0 auto 22px; }
  .logo-mark { display:grid; place-items:center; width:52px; height:52px; color:#ffdf7a;
               border:2px solid #ff4a2f; outline:1px solid rgba(255,223,122,.65);
               outline-offset:4px; font:bold 24px ui-monospace, monospace; letter-spacing:-.1em;
               text-shadow:0 0 12px rgba(255,72,38,.8); transform:skew(-8deg); }
  .logo-word { color:#ffe9a8; font:bold 28px ui-monospace, monospace; letter-spacing:.18em;
               text-shadow:0 0 22px rgba(255,190,55,.3); }
  .logo-sub { margin:-12px 0 22px; color:#a99561; font-size:10px; letter-spacing:.32em; }
  #start p  { max-width:360px; margin:0 auto 22px; text-align:center; line-height:1.65;
              color:#b9a873; font-size:12px; }
  #startBtn { min-width:170px; padding:12px 26px; color:#1a1103; background:#e6bd55;
              border:1px solid #ffe8a0; font:700 12px ui-monospace, monospace; letter-spacing:.18em;
              cursor:pointer; box-shadow:0 0 24px rgba(220,155,35,.18); }
  #startBtn:hover, #startBtn:focus-visible { color:#fff3c2; background:#b33a25; outline:2px solid #ffcc73;
                                              outline-offset:3px; }
  .menu-foot { margin-top:17px; color:#766a48; font-size:10px; letter-spacing:.1em; }
  @media (prefers-reduced-motion: reduce) { #start::before { display:none; } }
  #start h1 { font-weight:600; letter-spacing:.2em; font-size:30px;
              text-shadow:0 0 24px rgba(255,180,40,.35); }
  #start p  { max-width:560px; text-align:center; line-height:1.7; color:#c8b070; }
  #win    { position:fixed; inset:0; z-index:25; display:none; align-items:center;
            justify-content:center; flex-direction:column; color:#ffd24a;
            background:radial-gradient(ellipse at center, rgba(40,30,5,.86), rgba(0,0,0,.96)); }
  #win h1  { font-size:42px; letter-spacing:.3em; text-shadow:0 0 30px rgba(255,180,40,.6); }
  #win .sub{ color:#c8b070; margin-top:10px; }
  #cross { left:50%; top:50%; width:4px; height:4px; margin:-2px;
           border-radius:50%; background:rgba(255,240,200,.55); }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="cross" class="hud"></div>
<div id="rec" class="hud">● REC 00:00:00:00</div>
<div id="stamp" class="hud"></div>
<div id="bk1" class="brk"></div><div id="bk2" class="brk"></div>
<div id="bk3" class="brk"></div><div id="bk4" class="brk"></div>
<div id="map" class="hud"></div>
<div id="pos" class="hud"></div>
<div id="info" class="hud"></div>
<div id="prompt" class="hud">[E] open the door</div>
<div id="fade"></div>
<div id="win"><h1>YOU ESCAPED</h1><div class="sub">press R to dive again</div></div>
<div id="start">
  <div class="menu-card">
    <div class="logo" aria-label="BackroomsX">
      <div class="logo-mark" aria-hidden="true">B<span style="color:#ff4a2f">X</span></div>
      <div class="logo-word">BACKROOMSX</div>
    </div>
    <div class="logo-sub">FIELD RECORDING // LEVEL 0</div>
    <p>Somewhere between the rooms, the building forgot its way out.<br>
       Find the red EXIT glow. Keep the camera rolling.</p>
    <button id="startBtn" type="button">ENTER LEVEL 0</button>
    <div class="menu-foot">WASD MOVE&nbsp;&nbsp;·&nbsp;&nbsp;E DOORS&nbsp;&nbsp;·&nbsp;&nbsp;V VHS FX</div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
